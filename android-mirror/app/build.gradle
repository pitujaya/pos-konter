plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.konter.posmirror'
    compileSdk 34

    defaultConfig {
        applicationId 'id.konter.posmirror'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.7-print-fix'

        // ---- AUTO LOGIN ----
        // Ganti kredensial di sini lalu build ulang APK.
        // Kosongkan id atau pw untuk mematikan auto login.
        buildConfigField "boolean", "AUTO_LOGIN", "true"
        buildConfigField "String", "AUTO_LOGIN_ID", "\"kasir.toko@konter.id\""
        buildConfigField "String", "AUTO_LOGIN_PW", "\"shincan1\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
}
