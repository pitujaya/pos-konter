# ServisHP Pro — Nginx reverse proxy untuk Ubuntu
#
# PENTING: file ini TIDAK aktif otomatis setelah diedit.
#   sudo cp deploy/nginx-pos-konter.conf /etc/nginx/sites-available/pos-konter
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cara pakai:
#   sudo cp deploy/nginx-pos-konter.conf /etc/nginx/sites-available/pos-konter
#   sudo nano /etc/nginx/sites-available/pos-konter   # ganti SERVER_DOMAIN / SERVER_IP
#   sudo ln -sf /etc/nginx/sites-available/pos-konter /etc/nginx/sites-enabled/pos-konter
#   sudo nginx -t && sudo systemctl reload nginx
#
# Opsi A (tanpa domain, akses via IP LAN): buka http://SERVER_IP/
# Opsi B (dengan domain + HTTPS): isi server_name + jalankan certbot (lihat deploy-ubuntu.sh)

upstream pos_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    # Generic: bisa diakses via IP VPS mana saja / domain mana saja.
    # Installer otomatis mengganti SERVER_DOMAIN dengan --domain=... bila ada.
    # Jangan hardcode 192.168.x.x di sini agar config bisa dipakai di VPS internet.
    server_name SERVER_DOMAIN;

    client_max_body_size 5m;  # upload gambar slide maks 3MB + margin
    charset utf-8;

    # Log ringkas
    access_log /var/log/nginx/pos-konter.access.log;
    error_log /var/log/nginx/pos-konter.error.log warn;

    # Frontend + API (satu pintu via FastAPI :8000)
    location / {
        proxy_pass http://pos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Header keamanan dasar:
        #   X-Frame-Options  -> anti clickjacking (halaman tidak bisa diframe situs lain)
        #   X-Content-Type-Options -> cegah browser menebak-nebak tipe file
        #   Referrer-Policy  -> jangan bocorkan URL lengkap ke situs lain
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # --- Cache aset statis ---
    # PENTING: JS/CSS TIDAK boleh di-cache lama (mis. 7 hari). Query ?v=... di
    # index.html hanya berubah saat deploy; kalau browser masih menyimpan versi
    # lama sampai berminggu-minggu, kasir memakai JS lama -> tombol error / data
    # tidak sinkron. Pakai cache pendek (1 jam) + query ?v= sebagai cache busting.
    location ~* \.(css|js)$ {
        proxy_pass http://pos_backend;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Gambar/ikon boleh lebih lama, tapi tetap dibatasi 1 hari supaya gambar slide
    # yang diganti tidak lama tertahan di cache browser.
    location ~* \.(png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        proxy_pass http://pos_backend;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Upload (gambar slide): PAKAI ^~ supaya location ini MENANG dari regex
    # .jpg/.png di atas. nginx selalu memprioritaskan regex location di atas
    # prefix location biasa; prefix dengan ^~ menghentikan pencarian regex.
    # Tanpa ^~, upload ikut cache 1 hari -> gambar slide baru tidak muncul.
    # Cache singkat (5 menit) karena file upload sering diganti/overwrite.
    location ^~ /static/uploads/ {
        proxy_pass http://pos_backend;
        proxy_set_header Host $host;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # --- Blokir dokumentasi API (schema TIDAK boleh publik) ---
    # FastAPI otomatis menyediakan /openapi.json, /docs, /redoc. Kalau terbuka,
    # siapa pun (termasuk scanner internet) bisa melihat daftar endpoint, skema
    # data, dan struktur internal aplikasi. Semua harus 404 di sisi nginx.
    location = /openapi.json { return 404; }
    location = /api/docs    { return 404; }
    location = /docs        { return 404; }
    location = /redoc       { return 404; }
}
